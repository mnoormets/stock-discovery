services:
  # --- PostgreSQL andmebaas: hoiab päevaseid snapshotte ---
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: discovery
      POSTGRES_PASSWORD: discovery
      POSTGRES_DB: discovery
    ports:
      - "5433:5432"   # host 5433, et ei põrkuks su teise Postgresiga
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Next.js rakendus: dashboard + kogumise API ---
  app:
    build: .
    environment:
      # Golden source on alates 2026-08-19 Neon, MITTE lokaalne `db` teenus.
      # Varem oli siin kõvakodeeritud db:5432 URL, mis võitis .env-i ja pani
      # konteineri vaikselt näitama külmutatud cutover-eelseid andmeid.
      # `:?` on TEADLIK valik: tühi väärtus langeks src/lib/db.ts:12-14
      # fallback'i tõttu tagasi täpselt sellele samale külmutatud baasile
      # ja viga oleks jälle nähtamatu. Parem, kui konteiner katkeb valjult.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL peab olema .env failis määratud (Neoni golden source)}
      TZ: Europe/Tallinn
      # Loetakse .env failist (compose interpoleerib automaatselt). Kui puudub → tühi.
      FMP_API_KEY: ${FMP_API_KEY:-}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET peab olema .env failis määratud}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
    ports:
      - "3005:3000"   # host 3005 (3000 on juba st-app kasutuses)
    volumes:
      - ./:/app
      - /app/node_modules   # ära kirjuta konteineri node_modules'i üle
    depends_on:
      db:
        condition: service_healthy

  # --- Ajastaja: kutsub iga päev kl 08:00 kogumise API-t ---
  #
  # EI KÄIVITU vaikimisi (`profiles`). Põhjus: päevast kadentsi tagab alates
  # 2026-08-20 cron-job.org -> GitHub Actions ahel, mis ei sõltu ühestki
  # lokaalsest masinast. Kuni app sihtis külmutatud lokaalset baasi, oli see
  # ajastaja kahjutu; nüüd kirjutaks ta Neoni ja oleks kolmas päevane trigger
  # (08:00 siin, 08:05 Windows Task Scheduler, 08:10 cron-job.org).
  # Idempotentsus teeb selle ohutuks, aga vaikimisi ei ole seda vaja.
  #
  # Käsitsi käivitamiseks: docker compose --profile scheduler up -d
  scheduler:
    profiles: ["scheduler"]
    build:
      context: ./scheduler
    environment:
      TZ: Europe/Tallinn
      COLLECT_URL: http://app:3000/api/collect
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET peab olema .env failis määratud}
      CRON_SCHEDULE: "0 8 * * *"
    depends_on:
      - app

volumes:
  db_data:
