# Captures hypothetical fills and daily marks from fresh US regular-session
# Yahoo quotes. This workflow never sends an order to a broker.
#
# It is workflow_dispatch-only for the same private-repo/free-tier reason as
# collect-daily.yml. A separate external trigger must call it shortly after
# 09:30 America/New_York; the script still fails closed on marketState/time.
name: paper-strategy-execute

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-strategy-execute
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Kontrolli, et NEON_DATABASE_URL secret on olemas
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret puudub või on tühi." >&2
            exit 1
          fi
      - name: Capture fresh paper fills and marks
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          DATABASE_TARGET: golden
          TZ: America/New_York
        run: npm run paper:strategy -- execute

      # Separate dead-man switch from the core collection. The default success()
      # condition means failed execution never sends a false healthy ping.
      - name: Send paper execution Healthchecks heartbeat
        continue-on-error: true
        timeout-minutes: 1
        env:
          PAPER_STRATEGY_HEALTHCHECKS_PING_URL: ${{ secrets.PAPER_STRATEGY_HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$PAPER_STRATEGY_HEALTHCHECKS_PING_URL" ]; then
            echo "PAPER_STRATEGY_HEALTHCHECKS_PING_URL is not configured; skipping heartbeat."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 10 "$PAPER_STRATEGY_HEALTHCHECKS_PING_URL"
